name: Deploy (dev)

# P1-5: deploy to dev on every merge to main, signed in via OIDC so no AWS
# keys are stored in GitHub. Requires one-time setup described in
# infra/README.md before this workflow can actually run successfully:
#   - an IAM OIDC identity provider for token.actions.githubusercontent.com
#   - a deploy role that trusts it, with its ARN saved as the repo variable
#     AWS_DEPLOY_ROLE_ARN (Settings > Secrets and variables > Actions > Variables)
#   - `cdk bootstrap` run once against the target account/region
on:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: cdk deploy
        working-directory: infra
        run: pnpm run deploy -- --require-approval never
        env:
          STAGE: dev

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowio - presenter view</title>
    <link rel="stylesheet" href="/src/presenter/style.css" />
  </head>
  <body>
    <header class="presenter-topbar">
      <span id="timer" class="presenter-timer">00:00</span>
      <span class="presenter-hint">Opens and controls the audience window (present.html) in sync -- open that separately on the projector/second monitor.</span>
      <div class="presenter-nav">
        <button id="prev" class="secondary" type="button">‹ Prev</button>
        <button id="next" class="secondary" type="button">Next ›</button>
      </div>
    </header>

    <div class="presenter-body">
      <main id="current-slide" class="presenter-current"></main>
      <aside class="presenter-side">
        <h3>Next</h3>
        <div id="next-slide" class="presenter-next"></div>
      </aside>
    </div>

    <section class="presenter-notes">
      <h3>Speaker notes</h3>
      <p id="notes-text" class="presenter-notes__text"></p>
    </section>

    <script type="module" src="/src/presenter/main.ts"></script>
  </body>
</html>
